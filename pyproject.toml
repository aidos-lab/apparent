[project]
name = "apparent"
version = "0.1.0"
description = "Analyzing Physician-Patient Referral Networks"
authors = [{ name = "jeremy.wayland", email = "jeremy.don.wayland@gmail.com" }]
requires-python = "~=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "curvature-filtrations>=0.1.0,<0.2",
    "pandas>=2.2.3,<3",
    "python-dotenv>=1.0.1,<2",
    "matplotlib>=3.9.2,<4",
    "tqdm>=4.67.1,<5",
    "swifter>=1.4.0,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.3,<9",
]

[tool.hatch.build.targets.sdist]
include = ["apparent"]

[tool.hatch.build.targets.wheel]
include = ["apparent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
